name: PinDrop
options:
  bundleIdPrefix: com.goodvibesclub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  PinDrop:
    type: application
    platform: iOS
    sources:
      - path: VibeMatch
        excludes:
          - "Package.swift"
          - ".build/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goodvibesclub.pindrop
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Pin Drop
    info:
      path: VibeMatch/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIAppFonts:
          - Brice-Black.otf
          - Brice-Bold.otf
          - Mundial-Bold.otf
          - Mundial-Regular.otf
          - MundialDemibold.otf
